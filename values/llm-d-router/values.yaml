# Use endpoint-picker gateway mode with cache affinity and token-load scoring.
# The scoring thresholds are tuned for CPU inference. See docs/model-sizing.md.
router:
  monitoring:
    interval: 15s
    prometheus:
      enabled: true
      auth:
        enabled: false
  modelServers:
    matchLabels:
      app: vllm
    targetPorts:
      - number: 8000
  inferencePool:
    failureMode: FailOpen
  epp:
    replicas: 1
    pluginsConfigFile: kcs-plugins.yaml
    pluginsCustomConfig:
      kcs-plugins.yaml: |
        apiVersion: llm-d.ai/v1
        kind: EndpointPickerConfig
        plugins:
        - type: approx-prefix-cache-producer
        - type: inflight-load-producer
        # Stick to the replica that has the prompt prefix cached, unless its estimated time to first token
        # (in-flight tokens / peakPrefillThroughput) is more than maxTTFTPenaltyMs behind the best other replica.
        # Calibrated for this sandbox (docs/model-sizing.md): measured ~1,475 prefill tokens/s for Qwen2.5-0.5B on 4 CPU
        # threads (upstream default 15,928 is an H100), and a 1 s penalty (default 18 s) because agents are interactive.
        # With the defaults, every request of a shared system prompt stuck to one replica on CPU.
        - type: prefix-cache-affinity-filter
          parameters:
            peakPrefillThroughput: 1500
            maxTTFTPenaltyMs: 1000
        - type: token-load-scorer
        schedulingProfiles:
        - name: default
          plugins:
          - pluginRef: prefix-cache-affinity-filter
          - pluginRef: token-load-scorer
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 512Mi
