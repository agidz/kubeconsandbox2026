{{/* Deploy the workload where the gateway requests Keycloak decisions. */}}
{{- if eq .Values.decisions "keycloak" }}
# AuthZEN PEP (spike S7, ADR-017): Agent Router asks it about every MCP request (MCPRoute extAuth); it asks Keycloak
# (AuthZEN PDP) whether the user may call the tool. Code: files/pep.py (standard library only, no image build).
# Identity: ServiceAccount mcp/mcp-pep → SPIRE JWT-SVID → Keycloak client mcp-tools (no secret).
apiVersion: v1
kind: ServiceAccount
metadata: { name: mcp-pep, namespace: mcp }
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata: { name: mcp-pep, namespace: mcp }
data:
  pep.py: {{ .Files.Get "files/pep.py" | quote }}
  helper.conf: |
    agent_address = "/spiffe-workload-api/spire-agent.sock"
    daemon_mode = true
    cert_dir = "/svid"
    jwt_svids = [{ jwt_audience = "https://keycloak.{{ .Values.baseDomain }}/realms/sandbox", jwt_svid_file_name = "jwt_svid.token" }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: mcp-pep, namespace: mcp, labels: { app: mcp-pep } }
spec:
  replicas: 1
  selector: { matchLabels: { app: mcp-pep } }
  template:
    metadata:
      labels: { app: mcp-pep }
      annotations: { checksum/code: {{ .Files.Get "files/pep.py" | sha256sum | trunc 12 }} }
    spec:
      serviceAccountName: mcp-pep
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 1000, seccompProfile: { type: RuntimeDefault } }
      initContainers:
        - name: spiffe-helper          # native sidecar: keeps /svid/jwt_svid.token fresh (SVIDs live 5 min)
          image: {{ .Values.pep.spiffeHelperImage }}
          restartPolicy: Always
          args: [-config, /conf/helper.conf]
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
          volumeMounts:
            - { name: spiffe, mountPath: /spiffe-workload-api, readOnly: true }
            - { name: svid, mountPath: /svid }
            - { name: code, mountPath: /conf }
      containers:
        - name: pep
          image: {{ .Values.pep.image }}
          command: [python3, /app/pep.py]
          env:
            - { name: KEYCLOAK_REALM_URL, value: "https://keycloak.{{ .Values.baseDomain }}/realms/sandbox" }
            - { name: CA_FILE, value: /etc/sandbox-ca/ca.crt }
            - { name: PYTHONUNBUFFERED, value: "1" }
          ports: [{ name: http, containerPort: 8080 }]
          readinessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 5 }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          resources: { requests: { cpu: 20m, memory: 32Mi }, limits: { memory: 128Mi } }
          volumeMounts:
            - { name: code, mountPath: /app, readOnly: true }
            - { name: svid, mountPath: /svid, readOnly: true }
            - { name: sandbox-ca, mountPath: /etc/sandbox-ca, readOnly: true }
      volumes:
        - { name: spiffe, csi: { driver: csi.spiffe.io, readOnly: true } }
        - { name: svid, emptyDir: { medium: Memory } }
        - { name: code, configMap: { name: mcp-pep } }
        - { name: sandbox-ca, secret: { secretName: sandbox-ca } }
---
apiVersion: v1
kind: Service
metadata: { name: mcp-pep, namespace: mcp }
spec:
  selector: { app: mcp-pep }
  ports: [{ name: http, port: 8080, targetPort: http }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: mcp-pep, namespace: mcp }
spec:
  podSelector: { matchLabels: { app: mcp-pep } }
  policyTypes: [Ingress, Egress]
  ingress:   # only Agent Router (Envoy) asks
    - from: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: envoy-gateway-system } } }]
      ports: [{ port: 8080 }]
  egress:    # Keycloak through the gateway, DNS
    - to: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: envoy-gateway-system } } }]
    - to: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } }, podSelector: { matchLabels: { k8s-app: kube-dns } } }]
      ports: [{ port: 53, protocol: UDP }, { port: 53, protocol: TCP }]
{{- end }}
