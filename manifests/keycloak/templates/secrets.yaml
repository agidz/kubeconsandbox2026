{{/* Fetch realm placeholders, CA trust, and the reconciliation credential through ESO. */}}
kind: ExternalSecret
apiVersion: external-secrets.io/v1
metadata:
  name: realm-placeholders
  namespace: keycloak
  annotations: { argocd.argoproj.io/sync-wave: "-1" }
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: openbao }
  target: { name: realm-placeholders }
  data:
    {{- range .Values.users }}
    - { secretKey: {{ .name }}-password, remoteRef: { key: platform/sso-users/{{ .name }}, property: password } }
    {{- end }}
    {{- range .Values.clients }}{{ if not .spiffeId }}
    - { secretKey: {{ .name }}-client-secret, remoteRef: { key: platform/oidc/{{ .name }}, property: clientSecret } }{{ end }}
    {{- end }}
---
# The sandbox root CA (public) for Keycloak's truststore.
kind: ExternalSecret
apiVersion: external-secrets.io/v1
metadata:
  name: sandbox-ca
  namespace: keycloak
  annotations: { argocd.argoproj.io/sync-wave: "-1" }
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: openbao }
  target: { name: sandbox-ca }
  data: [{ secretKey: ca.crt, remoteRef: { key: platform/sandbox-ca-public, property: ca.crt } }]
---
# Client secret of master-realm client "realm-config" (the realm Job's own identity; created by the admin-bootstrap Job).
kind: ExternalSecret
apiVersion: external-secrets.io/v1
metadata:
  name: realm-config-client
  namespace: keycloak
  annotations: { argocd.argoproj.io/sync-wave: "-1" }
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: openbao }
  target: { name: realm-config-client }
  data: [{ secretKey: client-secret, remoteRef: { key: platform/keycloak/realm-config, property: clientSecret } }]
