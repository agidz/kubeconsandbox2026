# Enforce cluster-only egress even when an actor allowlist includes a public provider.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: atenet-egress-in-cluster-only
  namespace: ate-system
spec:
  podSelector:
    matchLabels:
      app: atenet-egress
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector: {}
