{{/* Give the signer setup Job access to the namespaces and trust-bundle signer it uses. */}}
kind: ServiceAccount
apiVersion: v1
metadata: { name: substrate-bootstrap, namespace: ate-system, annotations: { argocd.argoproj.io/sync-wave: "-4" } }
{{- range list "ate-system" "podcertificate-controller-system" "kagent" }}
---
kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata: { name: substrate-bootstrap, namespace: {{ . }}, annotations: { argocd.argoproj.io/sync-wave: "-4" } }
rules:
  - { apiGroups: [""], resources: [secrets, configmaps], verbs: [get, list, create, update, patch] }
---
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata: { name: substrate-bootstrap, namespace: {{ . }}, annotations: { argocd.argoproj.io/sync-wave: "-4" } }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: substrate-bootstrap }
subjects: [{ kind: ServiceAccount, name: substrate-bootstrap, namespace: ate-system }]
{{- end }}
---
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata: { name: substrate-bootstrap, annotations: { argocd.argoproj.io/sync-wave: "-4" } }
rules:
  - { apiGroups: [certificates.k8s.io], resources: [clustertrustbundles], verbs: [get, create, update, patch] }
  - { apiGroups: [certificates.k8s.io], resources: [signers], verbs: [attest], resourceNames: ["servicedns.podcert.ate.dev/identity"] }
  - { nonResourceURLs: ["/.well-known/openid-configuration"], verbs: [get] }
---
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata: { name: substrate-bootstrap, annotations: { argocd.argoproj.io/sync-wave: "-4" } }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: substrate-bootstrap }
subjects: [{ kind: ServiceAccount, name: substrate-bootstrap, namespace: ate-system }]
