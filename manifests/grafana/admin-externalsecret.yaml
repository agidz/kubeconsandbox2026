# Reconcile the emergency Grafana login from OpenBao.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: grafana-admin
    template:
      data:
        admin-user: admin
        admin-password: '{{ .password }}'
  data:
    - secretKey: password
      remoteRef:
        key: platform/grafana
        property: adminPassword
