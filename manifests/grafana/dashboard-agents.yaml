# Load the agent dashboard through the Grafana ConfigMap sidecar.
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-agents
  namespace: monitoring
  labels:
    grafana_dashboard: '1'
data:
  agents.json: |
    {
      "uid": "kcs-agents",
      "title": "Agents (Substrate + Agent Router)",
      "tags": [
        "kubeconsandbox",
        "agents"
      ],
      "timezone": "browser",
      "schemaVersion": 41,
      "refresh": "30s",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "description": "Sandboxed agents that sleep and wake in milliseconds, with every model call governed at Agent Router, and every tool call an agent makes for a user attributed to both.",
      "panels": [
        {
          "id": 1,
          "type": "row",
          "title": "Agent runtime (Agent Substrate)",
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 24,
            "h": 1
          },
          "collapsed": false,
          "panels": []
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Workers ready",
          "description": "gVisor workers ready to host actors, across all WorkerPools.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 1,
            "w": 4,
            "h": 4
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(ate_workerpool_ready_workers)",
              "instant": true,
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "decimals": 0,
              "color": {
                "mode": "fixed",
                "fixedColor": "text"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "none",
            "graphMode": "none",
            "textMode": "value",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Workers desired",
          "description": "Workers the WorkerPools ask for. Ready below desired means capacity is still coming up.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 4,
            "y": 1,
            "w": 4,
            "h": 4
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(ate_workerpool_desired_workers)",
              "instant": true,
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "decimals": 0,
              "color": {
                "mode": "fixed",
                "fixedColor": "text"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "none",
            "graphMode": "none",
            "textMode": "value",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Actor resumes (1h)",
          "description": "Actors restored from a snapshot onto a worker in the last hour (each message to a suspended Session resumes its actor).",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 8,
            "y": 1,
            "w": 4,
            "h": 4
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(increase(ate_actor_lifecycle_operation_duration_seconds_count{ate_actor_operation_name=\"resume\"}[1h]))",
              "instant": true,
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "decimals": 0,
              "color": {
                "mode": "fixed",
                "fixedColor": "text"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "none",
            "graphMode": "none",
            "textMode": "value",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          }
        },
        {
          "id": 5,
          "type": "stat",
          "title": "Actor suspends (1h)",
          "description": "Actors snapshotted and taken off their worker in the last hour (they suspend after every turn).",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 1,
            "w": 4,
            "h": 4
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(increase(ate_actor_lifecycle_operation_duration_seconds_count{ate_actor_operation_name=\"suspend\"}[1h]))",
