# Supply Grafana with its OIDC credentials and sandbox trust material.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-oidc
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: grafana-oidc
  data:
    - secretKey: clientSecret
      remoteRef:
        key: platform/oidc/grafana
        property: clientSecret
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sandbox-ca
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: sandbox-ca
  data:
    - secretKey: ca.crt
      remoteRef:
        key: platform/sandbox-ca-public
        property: ca.crt
