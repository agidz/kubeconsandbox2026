{{/* Publish Anthropic Messages through the internal gateway using an OpenBao-backed provider credential. */}}
kind: Backend
apiVersion: gateway.envoyproxy.io/v1alpha1
metadata: { name: anthropic, namespace: agent-router }
spec:
  endpoints: [{ fqdn: { hostname: {{ .Values.anthropic.host }}, port: 443 } }]
---
kind: BackendTLSPolicy
apiVersion: gateway.networking.k8s.io/v1
metadata: { name: anthropic, namespace: agent-router }
spec:
  targetRefs: [{ group: gateway.envoyproxy.io, kind: Backend, name: anthropic }]
  validation:
    hostname: {{ .Values.anthropic.host }}
    wellKnownCACertificates: System
---
kind: AIServiceBackend
apiVersion: aigateway.envoyproxy.io/v1beta1
metadata: { name: anthropic, namespace: agent-router }
spec:
  schema: { name: Anthropic }
  backendRef: { name: anthropic, kind: Backend, group: gateway.envoyproxy.io }
---
# The API key exists only here (ADR-013/015). Agent Router only accepts a Secret reference for provider keys, so ESO
# syncs it from OpenBao secret/models/provider (ESO authenticates with its own ServiceAccount). Tier 3 by necessity.
kind: ExternalSecret
apiVersion: external-secrets.io/v1
metadata: { name: anthropic-apikey, namespace: agent-router, annotations: { argocd.argoproj.io/sync-wave: "-1" } }
spec:
  refreshInterval: 15m
  secretStoreRef: { kind: ClusterSecretStore, name: openbao }
  target: { name: anthropic-apikey }
  data: [{ secretKey: apiKey, remoteRef: { key: models/provider, property: apiKey } }]
---
kind: BackendSecurityPolicy
apiVersion: aigateway.envoyproxy.io/v1beta1
metadata: { name: anthropic-apikey, namespace: agent-router }
spec:
  targetRefs: [{ group: aigateway.envoyproxy.io, kind: AIServiceBackend, name: anthropic }]
  type: AnthropicAPIKey
  anthropicAPIKey:
    secretRef: { name: anthropic-apikey }
---
kind: AIGatewayRoute
apiVersion: aigateway.envoyproxy.io/v1beta1
metadata: { name: models, namespace: agent-router }
spec:
  parentRefs: [{ name: agent-router, kind: Gateway, group: gateway.networking.k8s.io }]
  rules:
    {{- if .Values.stub.enabled }}
    # Model "sandbox-stub" → the scripted stub (model-stub.yaml); Agent Router puts the request's model in this header.
    - matches: [{ headers: [{ type: Exact, name: x-ai-eg-model, value: sandbox-stub }] }]
      backendRefs: [{ name: model-stub }]
    {{- end }}
    - backendRefs: [{ name: anthropic }]   # every other model → Anthropic
