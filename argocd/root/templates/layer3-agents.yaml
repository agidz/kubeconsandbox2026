  (dict "name" "substrate-crds" "chart" "substrate-crds" "namespace" "ate-system" "wave" "30")
  (dict "name" "substrate-bootstrap" "path" "manifests/substrate-bootstrap" "namespace" "ate-system" "wave" "31" "helm" true
    "values" (dict "kubectlAteVersion" (index .Values.tools "kubectl-ate").version))
  (dict "name" "substrate-podcert" "chart" "substrate-podcert" "namespace" "podcertificate-controller-system" "wave" "33")
  (dict "name" "substrate-atelet" "chart" "substrate-atelet" "namespace" "ate-system" "wave" "34")
  (dict "name" "substrate" "chart" "substrate" "namespace" "ate-system" "wave" "35" "values" (include "kcs.values.substrate" . | fromYaml))
  (dict "name" "agent-router-crds" "chart" "ai-gateway-crds-helm" "namespace" "envoy-ai-gateway-system" "wave" "35")
