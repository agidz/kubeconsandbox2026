  (dict "name" "kagent" "chart" "kagent" "namespace" "kagent" "wave" "37" "manifests" true "manifestsHelm" true "values" (include "kcs.values.kagent" . | fromYaml))
  (dict "name" "gateway-routes-l3" "path" "manifests/envoy-gateway" "namespace" "envoy-gateway-system" "wave" "38" "helm" true "values" (dict "routesLayer" 3))
